<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sahîfe bulunamadı · Se’âdet-i Ebediyye</title>
  <meta name="description" content="Aradığınız sahîfe burada değil. Fihristten ya da aramadan devam edebilirsiniz.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4efe4">
  <meta name="color-scheme" content="light dark">

  <!-- Tema, ilk boyamadan önce (index.html ile aynı; eski 'ilmihal-theme' anahtarı) -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('ilmihal-theme'); } catch (e) {}
      var tema = { light: 'gunduz', sepia: 'sepya', dark: 'gece' }[t] || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'gece' : 'gunduz');
      document.documentElement.dataset.tema = tema;
    })();
  </script>

  <link rel="stylesheet" href="/fonts/fontlar.css">
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    /* Betik çalışmazsa: sistemin koyu tercihine göre gece belirteçleri (temel.css'teki gece ile aynı) */
    @media (prefers-color-scheme: dark) {
      :root:not([data-tema]) {
        color-scheme: dark;
        --zemin: #0a0d14; --zemin-2: #10141e; --zemin-3: #181d2a; --yuzey: #121723;
        --murekkep: #e9e2d0; --murekkep-2: #b9b2a1; --murekkep-3: #8f897b;
        --cizgi: rgba(233, 226, 208, 0.16); --cizgi-2: rgba(233, 226, 208, 0.08);
        --altin: #d8b26a; --altin-yazi: #e2c078; --altin-ince: rgba(216, 178, 106, 0.32);
        --surh: #e08a72; --yesil: #86c8a6; --yesil-yazi: #9bd3b5;
      }
      :root:not([data-tema]) .dugme-ana { background: var(--altin); border-color: var(--altin); color: #17120a; }
    }
    body { display: flex; flex-direction: column; }
    .ust { border-bottom: 1px solid var(--cizgi-2); }
    .ust .kap { display: flex; align-items: center; min-height: 64px; }
    .marka { display: inline-flex; align-items: center; gap: 0.7em; color: var(--murekkep); text-decoration: none; }
    .marka .semse { width: 26px; height: 26px; color: var(--altin); stroke-width: 1.1; }
    .marka b { font: 600 1.06rem/1 var(--yazi); white-space: nowrap; }
    main { flex: 1; display: flex; align-items: center; }
    .yok { display: grid; gap: var(--a-8); align-items: center; padding-block: var(--a-8) var(--a-9); }
    .yok h1 { margin-top: var(--a-3); max-width: 15ch; }
    .yok .giris-yazi { margin-top: var(--a-5); }
    .yok .sira { margin-top: var(--a-7); }
    .yok figure { margin: 0; padding: 3px; border: 1px solid var(--altin-ince); background: var(--zemin); }
    .yok figure img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; }
    .alt { padding-block: var(--a-5); border-top: 1px solid var(--cizgi-2); }
    @media (min-width: 860px) {
      .yok { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: var(--a-9); }
    }
    @media (max-width: 859px) {
      .yok { padding-top: var(--a-7); gap: var(--a-7); }
      .yok figure { max-width: 30rem; }
      .yok figure img { aspect-ratio: 16 / 7; object-position: 30% 60%; }
    }
  </style>
</head>
<body>
  <a class="atla" href="#icerik">İçeriğe geçin</a>
  <header class="ust">
    <div class="kap">
      <a class="marka" href="/" aria-label="Se’âdet-i Ebediyye — ana sayfa">
        <svg class="semse" viewBox="-12 -12 24 24" aria-hidden="true"><rect x="-7" y="-7" width="14" height="14"/><rect x="-7" y="-7" width="14" height="14" transform="rotate(45)"/><circle r="2.6"/></svg>
        <b>Se’âdet-i Ebediyye</b>
      </a>
    </div>
  </header>

  <main id="icerik" tabindex="-1">
    <div class="kap kap-dar yok">
      <div>
        <p class="ust-yazi surh">Bulunamadı</p>
        <h1 class="baslik-2">Aradığınız sahîfe burada değil</h1>
        <p class="giris-yazi">Adres değişmiş ya da yanlış yazılmış olabilir. Fihristten ya da aramadan devam edebilirsiniz.</p>
        <nav class="sira" aria-label="Devam edin">
          <a class="dugme dugme-ana" href="/icindekiler">Fihrist</a>
          <a class="dugme" href="/arama">Kitapta arayın</a>
          <a class="dugme" href="/">Ana sayfa</a>
        </nav>
      </div>
      <figure>
        <img src="/gorsel/nesne/rahle-bos-k.webp" srcset="/gorsel/nesne/rahle-bos-k.webp 768w, /gorsel/nesne/rahle-bos.webp 1536w" sizes="(min-width: 860px) 26rem, 100vw" width="768" height="512" alt="" loading="lazy" decoding="async">
      </figure>
    </div>
  </main>

  <footer class="alt">
    <div class="kap kunye">Se’âdet-i Ebediyye · Hakîkat Kitâbevi, 2026 baskısı · ilmihal.org</div>
  </footer>
</body>
</html>
